<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#1e293b">
  <!-- Top node -->
  <circle cx="50" cy="10" r="6"/>
  <!-- Upper-left node -->
  <circle cx="15" cy="30" r="6"/>
  <!-- Upper-right node -->
  <circle cx="85" cy="30" r="6"/>
  <!-- Lower-left node -->
  <circle cx="15" cy="70" r="6"/>
  <!-- Lower-right node -->
  <circle cx="85" cy="70" r="6"/>
  <!-- Bottom node -->
  <circle cx="50" cy="90" r="6"/>
  <!-- Center node -->
  <circle cx="50" cy="50" r="6"/>

  <!-- Outer edges -->
  <line x1="50" y1="10" x2="15" y2="30" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="85" y2="30" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="15" y1="30" x2="15" y2="70" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="30" x2="85" y2="70" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="15" y1="70" x2="50" y2="90" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="70" x2="50" y2="90" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>

  <!-- Inner edges to center -->
  <line x1="50" y1="50" x2="50" y2="10" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="15" y2="30" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="85" y2="30" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="15" y2="70" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="85" y2="70" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="90" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>


</svg>
